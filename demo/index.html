<!DOCTYPE html>
<html lang="en" data-theme="dark" data-demo="building" data-demo-id="review">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#111111">
  <title>FormTxt demo: A report under review</title>
  <link rel="icon" href="data:,">
  <style>html,body{background:#0a0a0a;height:100%;margin:0;padding:0;overflow:hidden}html[data-theme=light],html[data-theme=light] body{background:#ecebe6}#app{visibility:hidden}body.app-ready #app{visibility:visible}</style>
  <script>
(function () {
  var KEY = 'nodemode_ui_settings';
  var DEFAULT_THEME = 'studio';
  var DEFAULT_ACCENT = '#f97316';
  var LIGHT = { 'light': 1, 'sand': 1, 'nineties': 1, 'duck': 1, 'pro-light-grey': 1, 'pro-light': 1, 'classic': 1, 'adwaita-light': 1, 'soft-light': 1 };
  var PROFILES = {
    'studio':          ['#111111', '#17151b', '#222127', '#2a2a2a', '#34333a', '#f7f7f7', '#a4a4a4', '#8a8a8b', '#1c1b1d', '#191919'],
    'nodemode-dark':   ['#0a0a0a', '#121218', '#1a1a24', '#2a2a35', '#3a3a48', '#e8e8ee', '#a8a8b8', '#7a7a8a', '#0a0a0a', '#121218'],
    'light':           ['#ecebe6', '#f7f6f1', '#e2e0d8', '#d1cdc1', '#beb9aa', '#26241d', '#4c4a40', '#6f6c60', '#e7e5dd', '#f4f3ed'],
    'github-dark':     ['#0d1117', '#161b22', '#21262d', '#30363d', '#3d444d', '#e6edf3', '#9198a1', '#7d8590', '#0d1117', '#161b22'],
    'midnight':        ['#0b1020', '#101830', '#182242', '#25325c', '#324274', '#e4e9f7', '#9fabd0', '#7886b0', '#0b1020', '#101830'],
    'forest':          ['#0c130e', '#121c15', '#1a281e', '#2a4030', '#375441', '#e4efe7', '#a4bdac', '#7f9b89', '#0c130e', '#121c15'],
    'ember':           ['#140d0a', '#1d1310', '#2a1c16', '#452e22', '#5a3d2e', '#f2e8e2', '#c7ab9c', '#a08777', '#140d0a', '#1d1310'],
    'violet':          ['#100b1c', '#171129', '#221a3c', '#382c5e', '#493b78', '#ece6f9', '#b3a6d8', '#8f82b8', '#100b1c', '#171129'],
    'slate':           ['#101418', '#171d23', '#212a32', '#32404c', '#415260', '#e7edf2', '#a3b2bf', '#8191a0', '#101418', '#171d23'],
    'mono':            ['#0e0e0e', '#161616', '#202020', '#333333', '#454545', '#f0f0f0', '#ababab', '#8a8a8a', '#0e0e0e', '#161616'],
    'sand':            ['#efe8da', '#f8f3e9', '#e6dcc8', '#d4c7ab', '#c2b28e', '#2a2418', '#59503c', '#766b53', '#eae2d1', '#f5efe2'],
    'ocean':           ['#06131c', '#0a1c29', '#10293c', '#1d425e', '#285578', '#e2eef7', '#96b6cc', '#7497ae', '#06131c', '#0a1c29'],
    'rose':            ['#170b10', '#211117', '#301a22', '#4d2b38', '#653a49', '#f5e7ec', '#cfa5b3', '#aa8493', '#170b10', '#211117'],
    'terminal':        ['#050d05', '#0a140a', '#102010', '#1f3d1f', '#2b522b', '#d8f5d8', '#8fce8f', '#6ca66c', '#050d05', '#0a140a'],
    'contrast':        ['#000000', '#0a0a0a', '#161616', '#555555', '#777777', '#ffffff', '#d8d8d8', '#b0b0b0', '#000000', '#0a0a0a'],
    'nineties':        ['#c0c0c0', '#d4d0c8', '#b4b0a8', '#808080', '#ffffff', '#000000', '#202020', '#484848', '#008080', '#d4d0c8'],
    'duck':            ['#e9e4f7', '#f4f1fc', '#d9d2ef', '#c7bde6', '#b3a6dc', '#2b2540', '#4f4770', '#6b6388', '#e2dcf2', '#f4f1fc'],
    'pro-dark':        ['#1f1f1f', '#2b2b2b', '#363636', '#4a4a4a', '#818181', '#ececec', '#bdbdbd', '#a0a0a0', '#181818', '#2b2b2b'],
    'pro-medium-grey': ['#3a3a3a', '#454545', '#505050', '#666666', '#a0a0a0', '#f4f4f4', '#d6d6d6', '#c3c3c3', '#2e2e2e', '#454545'],
    'pro-light-grey':  ['#b9b9b9', '#c9c9c9', '#aeaeae', '#8c8c8c', '#5a5a5a', '#121212', '#2a2a2a', '#414141', '#a4a4a4', '#c9c9c9'],
    'pro-light':       ['#e3e3e3', '#f2f2f2', '#d6d6d6', '#b5b5b5', '#767676', '#1a1a1a', '#383838', '#545454', '#d0d0d0', '#f2f2f2'],
    'classic':         ['#d1d4d9', '#e1e4e8', '#c2c6cc', '#9ea4ad', '#666c76', '#14171c', '#2c323a', '#4a515b', '#c0c4ca', '#e1e4e8'],
    'solarized-dark':  ['#002b36', '#073642', '#0d4452', '#1b5563', '#768e97', '#fdf6e3', '#bcc6c6', '#9bb0b3', '#00212b', '#073642'],
    'adwaita-light':   ['#ebebeb', '#fafafa', '#dedde0', '#c0bfbc', '#77767b', '#241f31', '#3d3846', '#5e5c64', '#f6f5f4', '#fafafa'],
    'adwaita-dark':    ['#242424', '#303030', '#3a3a3a', '#4a4a4a', '#858585', '#ffffff', '#deddda', '#b4b3b0', '#1e1e1e', '#303030'],
    'breeze-dark':     ['#232629', '#31363b', '#3b4045', '#4d5359', '#828c94', '#eff0f1', '#c5cacd', '#a4adb3', '#1b1e20', '#31363b'],
    'soft-light':      ['#e8ebef', '#f4f6f8', '#dce0e6', '#c3c9d2', '#777d89', '#2b323c', '#454d59', '#5b6370', '#dfe3e8', '#f4f6f8'],
    'soft-dark':       ['#22262b', '#2b3036', '#353b43', '#454c56', '#7c8693', '#e1e6ec', '#b9c1cb', '#9ca6b2', '#1b1e22', '#2b3036']
  };
  var NAMES = ['--bg-primary', '--bg-secondary', '--bg-tertiary', '--border-color', '--border-light', '--text-primary', '--text-secondary', '--text-muted', '--canvas-bg', '--bg-node'];
  var SIZES = { small: 0.9, large: 1.15, larger: 1.3 };
  var theme = DEFAULT_THEME, accent = DEFAULT_ACCENT, intensity = 1, root = document.documentElement, i;
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s.appearance === 3 || s.appearance === 2) {
        if (s.theme && PROFILES[s.theme]) theme = s.theme;
        if (typeof s.accentColor === 'string' && /^#[0-9a-fA-F]{6}$/.test(s.accentColor)) accent = s.accentColor;
        if (s.appearance === 3 && typeof s.intensity === 'number') intensity = Math.min(1.5, Math.max(0, s.intensity));
      }
    } else if (localStorage.getItem('formtxt.theme') === 'light') theme = 'light';
  } catch (e) {}
  try {
    var ap = JSON.parse(localStorage.getItem('formtxt.prefs') || '{}');
    if (ap.themeAuto === true && window.matchMedia) {
      var dk = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var want = dk ? ap.themeDark : ap.themeLight;
      theme = typeof want === 'string' && PROFILES[want] && !LIGHT[want] === dk ? want : (dk ? DEFAULT_THEME : 'light');
    }
  } catch (e) {}
  var p = PROFILES[theme];
  root.setAttribute('data-theme', LIGHT[theme] ? 'light' : 'dark');
  for (i = 0; i < NAMES.length; i++) root.style.setProperty(NAMES[i], p[i]);
  root.style.setProperty('--accent-color', accent);
  root.style.setProperty('--accent-color-dim', accent + '33');
  root.style.setProperty('--accent-color-hover', 'color-mix(in srgb, ' + accent + ' 82%, #ffffff)');
  root.style.setProperty('--accent-intensity', String(intensity));
  root.style.background = p[0];
  var tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.setAttribute('content', p[0]);
  try {
    var pr = JSON.parse(localStorage.getItem('formtxt.prefs') || '{}');
    if (pr.reduceMotion === true) root.setAttribute('data-motion', 'reduced');
    if (localStorage.getItem('formtxt.darkPage') === '1') root.setAttribute('data-page-dark', '');
    var k = SIZES[pr.uiFontSize];
    if (k) { var base = [11, 12, 13, 14, 16, 20]; for (i = 0; i < base.length; i++) root.style.setProperty('--ft-' + base[i], (Math.round(base[i] * k * 10) / 10) + 'px'); }
  } catch (e) {}
})();
(function () {
  var r = document.documentElement, open = 0, h = 280;
  try {
    var t = JSON.parse(localStorage.getItem('formtxt.terminal') || '{}');
    open = t.open === true ? 1 : 0;
    if (typeof t.h === 'number' && t.h >= 120 && t.h <= 2000) h = Math.round(t.h);
  } catch (e) {}
  r.setAttribute('data-ft-dock', open ? 'open' : 'closed');
  r.setAttribute('data-ft-dock-h', String(h));
  r.style.setProperty('--ft-dock-size', h + 'px');
})();
  </script>
  <style>html[data-demo=building] #app{visibility:hidden!important}html[data-demo=building]:before{content:"Starting FormTxt";color:#a4a4a4;text-align:center;font:13px -apple-system,Segoe UI,system-ui,sans-serif;position:fixed;top:calc(50% - 30px);left:0;right:0}html[data-demo=building]:after{content:"";background:#222127 linear-gradient(90deg,#f97316,#fdba74) 0 0/60px 3px no-repeat;border-radius:2px;width:180px;height:3px;animation:1.4s ease-in-out infinite alternate demo-start;position:fixed;top:calc(50% - 2px);left:calc(50% - 90px)}@keyframes demo-start{to{background-position:120px 0}}</style>

</head>
<body>
  <div id="app"></div>

</body>
</html>
